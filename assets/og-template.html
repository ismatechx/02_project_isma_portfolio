<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  font-family: 'Inter', sans-serif;
  background: #07080C;
  color: #F2F3F7;
  position: relative;
}
body::before {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(40% 60% at 18% 22%, rgba(124,92,255,0.45), transparent 60%),
    radial-gradient(35% 50% at 82% 18%, rgba(0,212,255,0.30), transparent 60%),
    radial-gradient(40% 60% at 70% 90%, rgba(255,111,181,0.22), transparent 60%);
  filter: blur(40px);
}
body::after {
  content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 30%, transparent 75%);
}
.zone { position: absolute; z-index: 1; }
.top { top: 40px; left: 72px; right: 72px;
       display: flex; justify-content: space-between; align-items: center; }
.middle { top: 150px; left: 72px; right: 72px; }
.bottom { bottom: 130px; left: 72px; right: 72px;
          display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }

.logo {
  font-weight: 800; font-size: 22px;
  background: linear-gradient(120deg, #fff 30%, #00D4FF 90%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.badge {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 8px 18px 8px 14px;
  border-radius: 999px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.10);
  font-size: 14px; color: rgba(242,243,247,0.7); font-weight: 500;
}
.badge-dot {
  width: 8px; height: 8px; background: #22ff8c; border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(34,255,140,0.15);
}
.title {
  font-size: 84px;
  line-height: 0.98;
  font-weight: 700;
  letter-spacing: -0.045em;
  margin-bottom: 18px;
}
.accent {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-weight: 400;
  background: linear-gradient(110deg, #00D4FF 0%, #7C5CFF 50%, #FF6FB5 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  letter-spacing: -0.02em;
}
.sub {
  font-size: 20px;
  color: rgba(242,243,247,0.62);
  max-width: 720px;
  line-height: 1.45;
}
.tags { display: flex; gap: 10px; flex-wrap: wrap; max-width: 800px; }
.tag {
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.10);
  font-size: 14px; font-weight: 500;
  color: #F2F3F7;
}
.mono {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: rgba(242,243,247,0.42);
}
.mono .g { color: #00D4FF; }
.author {
  text-align: right;
  font-size: 16px;
  color: rgba(242,243,247,0.62);
  white-space: nowrap;
  flex-shrink: 0;
}
.author strong { color: #fff; display: block; font-weight: 600; font-size: 20px; margin-bottom: 4px; letter-spacing: -0.01em; }
</style></head>
<body>
  <div class="zone top">
    <div class="logo">ismatechx.dev</div>
    <div class="badge"><span class="badge-dot"></span>Open to AI &amp; Analytics roles</div>
  </div>
  <div class="zone middle">
    <h1 class="title"><span class="accent">AI Analytics</span><br/>Engineer.</h1>
    <p class="sub">5+ years turning data into decisions &mdash; now bringing GenAI into the BI workflow.</p>
  </div>
  <div class="zone bottom">
    <div class="tags">
      <span class="tag">Claude API</span>
      <span class="tag">RAG</span>
      <span class="tag">Power BI</span>
      <span class="tag">Tableau</span>
      <span class="tag">Python</span>
      <span class="tag">SQL</span>
    </div>
    <div class="author">
      <strong>Ismail Uthuman</strong>
      <span class="mono"><span class="g">$</span> whoami</span>
    </div>
  </div>
</body></html>
